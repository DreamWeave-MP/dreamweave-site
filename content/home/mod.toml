# DreamWeave Site as a DreamWeave project: a Jess package. `jess` names the Package Source it publishes,
# the repository root's own jess.toml, and each release tag `site-<version>` is one version of
# the package, packed by the Mod Template from that tag; every push packs a development build.
id = "0d00eb81-e2ac-4e51-a4ae-718241adc828"
slug = "site"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.site"

[[releases]]
version = "0.1.1"
date = 2026-10-19
summary = "First release published as a DreamWeave project."
