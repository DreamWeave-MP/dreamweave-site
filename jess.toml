manifest_version = 1

[package]
id = "org.dreamweave.site"
version = "0.1.1"
jess_api = "1"
include = ["src", "tests"]
tests = ["tests/run.jsl"]

[modules]
"@dreamweave/site/util" = "src/util.jsl"
"@dreamweave/site/json" = "src/json.jsl"
"@dreamweave/site/expr" = "src/expr.jsl"
"@dreamweave/site/tera" = "src/tera.jsl"
"@dreamweave/site/markdown" = "src/markdown.jsl"
"@dreamweave/site/sass" = "src/sass.jsl"
"@dreamweave/site" = "src/site.jsl"

[[layer]]
id = "dreamweave.site"
exports = [
  "@dreamweave/site/util",
  "@dreamweave/site/json",
  "@dreamweave/site/expr",
  "@dreamweave/site/tera",
  "@dreamweave/site/markdown",
  "@dreamweave/site/sass",
  "@dreamweave/site",
]
