manifest_version = 1

[package]
id = "org.dreamweave.site"
version = "0.1.0"
jess_api = "1"
include = ["src"]
tests = ["tests/run.luau"]

[modules]
"@dreamweave/site/util" = "src/util.luau"
"@dreamweave/site/json" = "src/json.luau"
"@dreamweave/site/expr" = "src/expr.luau"
"@dreamweave/site/tera" = "src/tera.luau"
"@dreamweave/site/markdown" = "src/markdown.luau"
"@dreamweave/site/sass" = "src/sass.luau"
"@dreamweave/site" = "src/site.luau"

[[layer]]
id = "dreamweave.site"
exports = [
  "@dreamweave/site/util",
  "@dreamweave/site/json",
  "@dreamweave/site/expr",
  "@dreamweave/site/tera",
  "@dreamweave/site/markdown",
  "@dreamweave/site/sass",
  "@dreamweave/site",
]
